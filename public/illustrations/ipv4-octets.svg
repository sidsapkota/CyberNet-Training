<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif">
  <title>An IPv4 address split into four octets of 8 bits each</title>
  <!-- Drawn for the navy screen panel (#061630) used in both themes. -->
  <style>
    .box { fill: #0a3558; stroke: #00c2ff; stroke-width: 2.5; }
    .num { font-family: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 40px; font-weight: 600; text-anchor: middle; fill: #00c2ff; }
    .dot { font-family: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 44px; font-weight: 600; text-anchor: middle; fill: #7d93b5; }
    .bits { font-size: 16px; font-weight: 600; text-anchor: middle; fill: #e6eef9; }
    .range { font-family: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 13px; text-anchor: middle; fill: #a3b6d2; }
  </style>
  <g transform="translate(4 30)">
    <rect class="box" x="0" y="0" width="128" height="80" rx="10"/>
    <text class="num" x="64" y="54">192</text>
    <text class="bits" x="64" y="110">8 bits</text>
    <text class="range" x="64" y="132">0–255</text>

    <text class="dot" x="148" y="58">.</text>

    <rect class="box" x="168" y="0" width="128" height="80" rx="10"/>
    <text class="num" x="232" y="54">168</text>
    <text class="bits" x="232" y="110">8 bits</text>
    <text class="range" x="232" y="132">0–255</text>

    <text class="dot" x="316" y="58">.</text>

    <rect class="box" x="336" y="0" width="128" height="80" rx="10"/>
    <text class="num" x="400" y="54">1</text>
    <text class="bits" x="400" y="110">8 bits</text>
    <text class="range" x="400" y="132">0–255</text>

    <text class="dot" x="484" y="58">.</text>

    <rect class="box" x="504" y="0" width="128" height="80" rx="10"/>
    <text class="num" x="568" y="54">10</text>
    <text class="bits" x="568" y="110">8 bits</text>
    <text class="range" x="568" y="132">0–255</text>
  </g>
</svg>
