<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 180" width="340" height="180" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif">
  <title>The L circle has flipped over: behind it is the grey hooded scammer, typing at a laptop. The padlock by Mia's sign-in code is green and stays shut.</title>
