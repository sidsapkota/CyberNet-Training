  <text x="40" y="31" font-size="16" font-weight="700" fill="#e6eef9">QuizTime</text>
  <text x="16" y="52" font-size="16" font-weight="600" fill="#e6eef9">Pop star name = first pet…</text>
  </g>
  <rect x="196" y="18" width="128" height="24" rx="12" fill="#061630" stroke="#3ddc97" stroke-width="1.5"/>
