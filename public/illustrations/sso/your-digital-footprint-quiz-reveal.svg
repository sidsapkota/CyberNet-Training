  <text x="16" y="122" font-size="16" font-weight="600" fill="#e6eef9">Security question:</text>
  <text x="16" y="144" font-size="16" font-weight="600" fill="#e6eef9">first pet's name?</text>
  <path d="M272 111.6V105.2A8 8 0 0 1 288 105.2V111.6" fill="none" stroke="#3ddc97" stroke-width="3.84" stroke-linecap="round" stroke-linejoin="round"/>
