<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220" width="340" height="220" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif">
  <title>The caller's laptop now says Hi, Sam: they're signed in to Sam's account. Sam's phone shows: New sign-in on another device.</title>
