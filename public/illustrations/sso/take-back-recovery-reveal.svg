<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 192" width="340" height="192" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif">
  <title>The recovery email now reads me@mail.example, with a green tick, and two-step sign-in is switched on.</title>
  <rect x="10" y="6" width="320" height="182" rx="14" fill="#1d3d6e" stroke="#6f8fbd" stroke-width="2"/>
  <text x="26" y="30" font-size="16" font-weight="600" fill="#a3b6d2">Security</text>
  <rect x="18" y="40" width="304" height="30" rx="9" fill="#24507f" stroke="#6f8fbd" stroke-width="1.5"/>
  <text x="30" y="61" font-size="16" font-weight="600" fill="#e6eef9">Password</text>
  <path d="M181 55L186 60L196 49" fill="none" stroke="#3ddc97" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="202" y="61" font-size="16" font-weight="500" fill="#3ddc97">Changed</text>
  <rect x="18" y="74" width="304" height="30" rx="9" fill="#24507f" stroke="#6f8fbd" stroke-width="1.5"/>
  <text x="30" y="95" font-size="16" font-weight="600" fill="#e6eef9">Laptop</text>
  <path d="M181 89L186 94L196 83" fill="none" stroke="#3ddc97" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
