  <rect x="18" y="108" width="304" height="40" rx="9" fill="#24507f" stroke="#3ddc97" stroke-width="2"/>
  <text x="30" y="124" font-size="16" font-weight="500" fill="#a3b6d2">Recovery email</text>
  <text x="30" y="142" font-size="16" font-weight="600" fill="#e6eef9" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace">me@mail.example</text>
  <path d="M293 126L298 131L308 120" fill="none" stroke="#3ddc97" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="18" y="152" width="304" height="30" rx="9" fill="#24507f" stroke="#6f8fbd" stroke-width="1.5"/>
  <text x="30" y="173" font-size="16" font-weight="600" fill="#e6eef9">Two-step sign-in</text>
  <text x="262" y="173" font-size="16" font-weight="500" fill="#3ddc97" text-anchor="end">On</text>
  <rect x="270" y="158" width="42" height="20" rx="10" fill="#3ddc97" stroke="#3ddc97" stroke-width="1.5"/>
  <circle cx="301" cy="168" r="7" fill="#061630"/>
