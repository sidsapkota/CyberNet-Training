<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 150" width="340" height="150" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif">
  <title>A chat on Sam's phone with GameMate_8, a game-controller picture with no face, marked Friend. Their message: what school do u go to? send a pic! The chat's menu is open, showing Block and Report.</title>
  <rect x="4" y="4" width="332" height="142" rx="12" fill="#1d3d6e" stroke="#6f8fbd" stroke-width="2"/>
  <circle cx="26" cy="30" r="14" fill="#24507f" stroke="#8be3ff" stroke-width="1.5"/>
