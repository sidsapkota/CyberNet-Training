  <text x="56" y="119" font-size="16" font-weight="500" fill="#e6eef9">Text me a code</text>
  <rect x="172" y="102" width="38" height="22" rx="11" fill="#3ddc97" stroke="#3ddc97" stroke-width="2"/>
  <circle cx="199" cy="113" r="7.5" fill="#e6eef9"/>
  <!-- Far away: the scammer is stuck -->
  <path d="M236 8V152" stroke="#6f8fbd" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>
  <text x="262" y="30" font-size="20" font-weight="700" fill="#a3b6d2" text-anchor="middle">?</text>
  <g transform="translate(288 38)">
    <rect x="-18" y="14" width="36" height="40" rx="12" fill="#4a5a72" stroke="#a3b6d2" stroke-width="2"/>
    <path d="M-16 8Q-18 -18 0 -18Q18 -18 16 8Q0 14 -16 8Z" fill="#4a5a72" stroke="#a3b6d2" stroke-width="2"/>
    <ellipse cx="0" cy="-1" rx="9.5" ry="10" fill="#1d2a3d"/>
  </g>
  <g transform="translate(314 26)">
    <circle cx="0" cy="0" r="5" fill="none" stroke="#ffb547" stroke-width="2.5"/>
    <path d="M5 0H18M14 0V4M18 0V4" fill="none" stroke="#ffb547" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <rect x="244" y="66" width="92" height="58" rx="6" fill="#1d3d6e" stroke="#ff7a7a" stroke-width="2"/>
  <path d="M240 124H338L332 134H246Z" fill="#4a5a72" stroke="#a3b6d2" stroke-width="2" stroke-linejoin="round"/>
  <text x="290" y="90" font-size="16" font-weight="600" fill="#e6eef9" text-anchor="middle">Enter the</text>
  <text x="290" y="110" font-size="16" font-weight="600" fill="#e6eef9" text-anchor="middle">code</text>
