  <path transform="translate(28 31) scale(0.8)" d="M-4 8V-10L10 -13V5M-4 8A4 4 0 1 1 -4 7.9M10 5A4 4 0 1 1 10 4.9" fill="none" stroke="#a3b6d2" stroke-width="2.4" stroke-linecap="round"/>
