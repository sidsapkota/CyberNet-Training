<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 160" width="340" height="160" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif">
  <title>The Text me a code switch is now on. Far away, the scammer is stuck at Enter the code.</title>
