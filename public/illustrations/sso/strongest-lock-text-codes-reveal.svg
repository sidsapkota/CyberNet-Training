  <text x="20" y="72" font-size="17" font-weight="600" fill="#e6eef9">Two-step sign-in</text>
  <rect x="14" y="88" width="204" height="50" rx="10" fill="#24507f" stroke="#3ddc97" stroke-width="2"/>
