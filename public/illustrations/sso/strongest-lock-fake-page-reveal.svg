<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 180" width="340" height="180" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif">
  <title>Mia's phone says No passkey for this site. The fake page's Password and Code boxes stay empty, and the scammer shrugs.</title>
  <!-- The scammer, behind the screen, shrugging -->
  <text x="230" y="66" font-size="20" font-weight="700" fill="#a3b6d2" text-anchor="middle">?</text>
  <g transform="translate(208 86)">
    <rect x="-18" y="14" width="36" height="40" rx="12" fill="#4a5a72" stroke="#a3b6d2" stroke-width="2"/>
    <path d="M-16 8Q-18 -18 0 -18Q18 -18 16 8Q0 14 -16 8Z" fill="#4a5a72" stroke="#a3b6d2" stroke-width="2"/>
    <ellipse cx="0" cy="-1" rx="9.5" ry="10" fill="#1d2a3d"/>
  </g>
  <path d="M222 108Q234 104 236 92" fill="none" stroke="#a3b6d2" stroke-width="9" stroke-linecap="round"/>
  <path d="M222 108Q234 104 236 92" fill="none" stroke="#4a5a72" stroke-width="5" stroke-linecap="round"/>
  <circle cx="237" cy="88" r="5" fill="#4a5a72" stroke="#a3b6d2" stroke-width="2"/>
  <!-- Laptop with the fake page: both boxes still empty -->
  <rect x="8" y="44" width="188" height="112" rx="8" fill="#1d3d6e" stroke="#6f8fbd" stroke-width="2"/>
  <path d="M2 156H202L194 168H10Z" fill="#24507f" stroke="#6f8fbd" stroke-width="2" stroke-linejoin="round"/>
  <text x="104" y="61" font-size="16" font-weight="600" fill="#a3b6d2">Email</text>
  <rect x="22" y="68" width="160" height="32" rx="6" fill="#122b52" stroke="#6f8fbd" stroke-width="1.5"/>
  <text x="32" y="90" font-size="16" fill="#a3b6d2">Password</text>
  <rect x="22" y="110" width="160" height="32" rx="6" fill="#122b52" stroke="#6f8fbd" stroke-width="1.5"/>
  <text x="32" y="132" font-size="16" fill="#a3b6d2">Code</text>
  <circle cx="197" cy="116" r="5" fill="#4a5a72" stroke="#a3b6d2" stroke-width="2"/>
  <g transform="rotate(-5 53 43)">
    <rect x="12" y="30" width="82" height="26" rx="6" fill="#ffb547"/>
    <text x="53" y="48" font-size="16" font-weight="600" fill="#041937" text-anchor="middle">Fake copy</text>
  </g>
  <!-- Mia's phone: no passkey for this site -->
  <path d="M288 34L304 34L297 46Z" fill="#24507f" stroke="#3ddc97" stroke-width="2" stroke-linejoin="round"/>
  <rect x="104" y="4" width="232" height="32" rx="10" fill="#24507f" stroke="#3ddc97" stroke-width="2"/>
  <text x="220" y="26" font-size="16" font-weight="600" fill="#e6eef9" text-anchor="middle">No passkey for this site</text>
  <rect x="262" y="46" width="70" height="130" rx="12" fill="#1d3d6e" stroke="#6f8fbd" stroke-width="2"/>
  <path d="M287 55H307" stroke="#6f8fbd" stroke-width="3" stroke-linecap="round"/>
  <path transform="translate(297 104)" d="M-10 -10H-5M5 -10H10V-5M10 5V10H5M-5 10H-10V5M-10 -5V-10M-3 -2V0M3 -2V0M-3 4A4 3 0 0 0 3 4" fill="none" stroke="#a3b6d2" stroke-width="2" stroke-linecap="round"/>
  <g transform="translate(297 140)"><path d="M-5 -2V-6A5 5 0 0 1 5 -6V-2" fill="none" stroke="#3ddc97" stroke-width="2.5"/><rect x="-8" y="-2" width="16" height="12" rx="2.5" fill="#3ddc97"/><circle cx="0" cy="3.5" r="1.8" fill="#122b52"/></g>
