<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 16 340 146" width="340" height="146" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif">
  <title>Leo's password manager: a vault holding many different keys, with a counter reading 30. A game site's icon has a red Hacked! banner.</title>
