  <text x="30" y="46" font-size="16" font-weight="600" fill="#e6eef9" text-anchor="start">Password manager</text>
  <g transform="translate(56 70)"><circle cx="0" cy="0" r="8" fill="none" stroke="#00c2ff" stroke-width="4"/><path d="M8 0H30M22 0V7M28 0V6" stroke="#00c2ff" stroke-width="4" stroke-linecap="round"/></g>
  <g transform="translate(108 70)"><circle cx="0" cy="0" r="8" fill="none" stroke="#ffb547" stroke-width="4"/><path d="M8 0H30M22 0V7M28 0V6" stroke="#ffb547" stroke-width="4" stroke-linecap="round"/></g>
  <g transform="translate(160 70)"><circle cx="0" cy="0" r="8" fill="none" stroke="#3ddc97" stroke-width="4"/><path d="M8 0H30M22 0V7M28 0V6" stroke="#3ddc97" stroke-width="4" stroke-linecap="round"/></g>
  <g transform="translate(56 104)"><circle cx="0" cy="0" r="8" fill="none" stroke="#8be3ff" stroke-width="4"/><path d="M8 0H30M22 0V7M28 0V6" stroke="#8be3ff" stroke-width="4" stroke-linecap="round"/></g>
  <g transform="translate(108 104)"><circle cx="0" cy="0" r="8" fill="none" stroke="#ffb547" stroke-width="4"/><path d="M8 0H30M22 0V7M28 0V6" stroke="#ffb547" stroke-width="4" stroke-linecap="round"/></g>
  <g transform="translate(160 104)"><circle cx="0" cy="0" r="8" fill="none" stroke="#3ddc97" stroke-width="4"/><path d="M8 0H30M22 0V7M28 0V6" stroke="#3ddc97" stroke-width="4" stroke-linecap="round"/></g>
  <rect x="150" y="118" width="46" height="24" rx="6" fill="#24507f"/>
  <text x="173" y="136" font-size="16" font-weight="600" fill="#e6eef9" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace">30</text>
  <rect x="236" y="48" width="80" height="80" rx="18" fill="#24507f" stroke="#6f8fbd" stroke-width="2"/>
  <text x="276" y="154" font-size="16" font-weight="600" fill="#e6eef9" text-anchor="middle">Game site</text>
  <g transform="translate(276 90) rotate(-8)"><rect x="-40" y="-13" width="80" height="26" rx="5" fill="#ff7a7a"/><text x="0" y="6" font-size="16" font-weight="600" fill="#2a1622" text-anchor="middle">Hacked!</text></g>
