<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 180" width="340" height="180" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif">
  <title>The stranger's Send button is greyed out, with a note: PixelFox only gets messages from friends.</title>
  <rect x="4" y="4" width="140" height="172" rx="12" fill="#1d3d6e" stroke="#6f8fbd" stroke-width="2"/>
  <text x="18" y="30" font-size="16" font-weight="600" fill="#a3b6d2">Settings</text>
  <text x="18" y="76" font-size="16" font-weight="700" fill="#e6eef9">Messages:</text>
  <text x="18" y="98" font-size="16" font-weight="700" fill="#e6eef9">friends only</text>
  <rect x="18" y="114" width="36" height="20" rx="10" fill="#00c2ff" stroke="#8be3ff" stroke-width="1.5"/>
  <circle cx="44" cy="124" r="7" fill="#e6eef9"/>
  <text x="64" y="130" font-size="16" font-weight="600" fill="#8be3ff">On</text>
  <rect x="152" y="4" width="184" height="172" rx="12" fill="#1d3d6e" stroke="#6f8fbd" stroke-width="2"/>
  <circle cx="172" cy="26" r="10" fill="#24507f" stroke="#6f8fbd" stroke-width="1.5"/>
  <text x="190" y="32" font-size="16" font-weight="700" fill="#e6eef9">PixelFox</text>
  <rect x="162" y="48" width="164" height="36" rx="10" fill="#24507f" stroke="#6f8fbd" stroke-width="1.5"/>
  <text x="174" y="72" font-size="16" font-weight="500" fill="#e6eef9">hey, cool tricks</text>
  <rect x="246" y="94" width="80" height="30" rx="8" fill="#16305a" stroke="#6f8fbd" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="286" y="114" font-size="16" font-weight="600" fill="#a3b6d2" text-anchor="middle">Send</text>
  <text x="162" y="150" font-size="16" font-weight="600" fill="#3ddc97">PixelFox only gets</text>
  <text x="162" y="170" font-size="16" font-weight="600" fill="#3ddc97">messages from friends</text>
</svg>
