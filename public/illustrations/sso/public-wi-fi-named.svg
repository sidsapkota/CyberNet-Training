  <rect x="300" y="58" width="4" height="16" rx="1" fill="#e6eef9" opacity="1"/>
  </g>
  <rect x="174" y="54" width="86" height="24" rx="12" fill="#061630" stroke="#ff7a7a" stroke-width="1.5"/>
  <text x="217" y="71" font-size="16" font-weight="600" fill="#ff7a7a" text-anchor="middle">fake Wi-Fi</text>
