  <rect x="164" y="12" width="96" height="24" rx="12" fill="#061630" stroke="#3ddc97" stroke-width="1.5"/>
  <text x="212" y="29" font-size="16" font-weight="600" fill="#3ddc97" text-anchor="middle">public Wi-Fi</text>
