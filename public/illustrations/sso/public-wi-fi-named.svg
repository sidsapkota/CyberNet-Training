<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 196" width="320" height="196" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif">
  <title>The Wi-Fi list, labelled. CornerCafe, from the café's Wi-Fi box, is public Wi-Fi. CornerCafe_Free, from someone's laptop, is fake Wi-Fi.</title>
