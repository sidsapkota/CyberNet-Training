  <path d="M110 66Q190 66 230 38" fill="none" stroke="#ffb547" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/>
  <rect x="30" y="106" width="40" height="40" rx="10" fill="#24507f" stroke="#6f8fbd" stroke-width="1.5"/>
  <text x="50" y="166" font-size="16" font-weight="600" fill="#a3b6d2" text-anchor="middle">Phone</text>
