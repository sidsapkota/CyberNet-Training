  <text x="126" y="166" font-size="16" font-weight="600" fill="#a3b6d2" text-anchor="middle">Notes</text>
  <rect x="182" y="106" width="40" height="40" rx="10" fill="#24507f" stroke="#6f8fbd" stroke-width="1.5"/>
  <text x="202" y="166" font-size="16" font-weight="600" fill="#a3b6d2" text-anchor="middle">Stickers</text>
