  <circle cx="240" cy="32" r="11" fill="#ffb547" opacity="0.25"/>
  <circle cx="240" cy="32" r="6" fill="#ffb547"/>
  <rect x="282" y="22" width="32" height="18" rx="4" fill="none" stroke="#e6eef9" stroke-width="2"/>
