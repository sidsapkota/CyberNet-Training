<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 16 340 140" width="340" height="140" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif">
  <title>Far away, a stranger's laptop on your game's sign-in page with your password typed in and the pointer on Next. Close by, your phone with two-step sign-in on.</title>
  <rect x="10" y="20" width="200" height="130" rx="10" fill="#1d3d6e" stroke="#6f8fbd" stroke-width="2"/>
  <text x="24" y="48" font-size="16" font-weight="600" fill="#a3b6d2" text-anchor="start">Game: sign in</text>
  <rect x="24" y="60" width="172" height="30" rx="6" fill="#122b52" stroke="#6f8fbd" stroke-width="1.5"/>
  <text x="34" y="81" font-size="16" font-weight="600" fill="#e6eef9" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace">••••••••</text>
  <rect x="120" y="104" width="76" height="30" rx="6" fill="#24507f"/>
  <text x="158" y="125" font-size="16" font-weight="600" fill="#e6eef9" text-anchor="middle">Next</text>
  <path d="M150 118l14 14l-5 1l4 8l-4 2l-4-8l-5 4z" fill="#e6eef9"/>
  <g transform="translate(48 104) scale(0.6)"><path d="M-22 40V18A22 22 0 0 1 22 18V40Z" fill="#4a5a72" stroke="#a3b6d2" stroke-width="2"/><circle cx="0" cy="8" r="14" fill="#1d2a3d" stroke="#a3b6d2" stroke-width="2"/></g>
  <path d="M218 85H244" stroke="#a3b6d2" stroke-width="2" stroke-dasharray="3 5"/>
  <rect x="252" y="24" width="72" height="128" rx="12" fill="#1d3d6e" stroke="#6f8fbd" stroke-width="2"/>
  <text x="288" y="70" font-size="16" font-weight="600" fill="#a3b6d2" text-anchor="middle">Your</text>
  <text x="288" y="92" font-size="16" font-weight="600" fill="#a3b6d2" text-anchor="middle">phone</text>
  <text x="288" y="124" font-size="16" font-weight="600" fill="#3ddc97" text-anchor="middle">2-step</text>
</svg>
