<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 178" width="340" height="178" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif">
  <title>The Security page. Password changed and the laptop signed out, both ticked. The recovery email is x9help@mail.example, outlined with a question mark: you've never seen it. Two-step sign-in is off.</title>
  <rect x="10" y="6" width="320" height="168" rx="14" fill="#1d3d6e" stroke="#6f8fbd" stroke-width="2"/>
  <text x="26" y="30" font-size="16" font-weight="600" fill="#a3b6d2">Security</text>
  <rect x="18" y="36" width="304" height="28" rx="9" fill="#24507f" stroke="#6f8fbd" stroke-width="1.5"/>
  <text x="30" y="56" font-size="16" font-weight="600" fill="#e6eef9">Password</text>
  <path d="M181 50L186 55L196 44" fill="none" stroke="#3ddc97" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="202" y="56" font-size="16" font-weight="500" fill="#3ddc97">Changed</text>
  <rect x="18" y="68" width="304" height="28" rx="9" fill="#24507f" stroke="#6f8fbd" stroke-width="1.5"/>
  <text x="30" y="88" font-size="16" font-weight="600" fill="#e6eef9">Laptop</text>
  <path d="M181 82L186 87L196 76" fill="none" stroke="#3ddc97" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="202" y="88" font-size="16" font-weight="500" fill="#3ddc97">Signed out</text>
  <rect x="18" y="100" width="304" height="38" rx="9" fill="#24507f" stroke="#ffb547" stroke-width="2"/>
  <text x="30" y="115" font-size="16" font-weight="500" fill="#a3b6d2">Recovery email</text>
  <text x="30" y="133" font-size="16" font-weight="600" fill="#e6eef9" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace">x9help@mail.example</text>
  <text x="300" y="127" font-size="22" font-weight="700" fill="#ffb547" text-anchor="middle">?</text>
  <rect x="18" y="142" width="304" height="28" rx="9" fill="#24507f" stroke="#6f8fbd" stroke-width="1.5"/>
  <text x="30" y="162" font-size="16" font-weight="600" fill="#e6eef9">Two-step sign-in</text>
  <text x="262" y="162" font-size="16" font-weight="500" fill="#a3b6d2" text-anchor="end">Off</text>
  <rect x="270" y="146" width="42" height="20" rx="10" fill="#061630" stroke="#6f8fbd" stroke-width="1.5"/>
  <circle cx="281" cy="156" r="7" fill="#a3b6d2"/>
</svg>
