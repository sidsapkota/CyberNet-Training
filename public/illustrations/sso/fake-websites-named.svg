<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif">
  <title>The address yourbank.example.login-check.example, taken apart. yourbank.example is a decoy. login-check is the owner: the name just before the ending. .example is the ending. Your Bank's real address is yourbank.example.</title>
  <rect x="4" y="4" width="312" height="34" rx="17" fill="#061630" stroke="#6f8fbd" stroke-width="1.2"/>
  <text x="18" y="27" font-size="16" font-weight="500" fill="#e6eef9">yourbank.example.login-check.example</text>
  <rect x="10" y="48" width="190" height="34" rx="8" fill="#1d3d6e" stroke="#6f8fbd" stroke-width="1.2"/>
  <text x="22" y="71" font-size="16" font-weight="500" fill="#a3b6d2">yourbank.example.</text>
  <path d="M206 65H220" fill="none" stroke="#6f8fbd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="226" y="52" width="88" height="26" rx="6" fill="#6f8fbd"/>
  <text x="270" y="70.5" font-size="16" font-weight="600" fill="#061630" text-anchor="middle">Decoy</text>
  <rect x="10" y="88" width="190" height="34" rx="8" fill="#06304a" stroke="#00c2ff" stroke-width="2"/>
  <text x="22" y="111" font-size="16" font-weight="700" fill="#e6eef9">login-check</text>
  <path d="M206 105H220" fill="none" stroke="#00c2ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="226" y="92" width="88" height="26" rx="6" fill="#00c2ff"/>
  <text x="270" y="110.5" font-size="16" font-weight="600" fill="#061630" text-anchor="middle">Owner</text>
  <rect x="10" y="128" width="190" height="34" rx="8" fill="#1d3d6e" stroke="#ffb547" stroke-width="2"/>
  <text x="22" y="151" font-size="16" font-weight="700" fill="#e6eef9">.example</text>
  <path d="M206 145H220" fill="none" stroke="#ffb547" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="226" y="132" width="88" height="26" rx="6" fill="#ffb547"/>
  <text x="270" y="150.5" font-size="16" font-weight="600" fill="#061630" text-anchor="middle">Ending</text>
  <text x="10" y="192" font-size="16" font-weight="500" fill="#a3b6d2">Real address:</text>
  <text x="124" y="192" font-size="16" font-weight="700" fill="#e6eef9">yourbank.example</text>
</svg>
