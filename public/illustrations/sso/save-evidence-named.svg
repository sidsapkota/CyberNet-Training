<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 198" width="320" height="198" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif">
  <title>The same chat, labelled. A dashed frame around the username, the time and the message, marked 1, Screenshot. The Block button is marked 2, and the Report button 3.</title>
  <rect x="4" y="4" width="312" height="190" rx="16" fill="#1d3d6e" stroke="#6f8fbd" stroke-width="2"/>
  <text x="16" y="30" font-size="16" font-weight="600" fill="#e6eef9">Weekend Crew</text>
  <rect x="132" y="12" width="64" height="28" rx="7" fill="#061630" stroke="#6f8fbd" stroke-width="1.5"/>
  <text x="164" y="32" font-size="16" font-weight="600" fill="#e6eef9" text-anchor="middle">Block</text>
  <circle cx="150" cy="52" r="11" fill="#00c2ff"/>
  <text x="150" y="57.5" font-size="16" font-weight="700" fill="#061630" text-anchor="middle">2</text>
  <rect x="232" y="12" width="72" height="28" rx="7" fill="#061630" stroke="#6f8fbd" stroke-width="1.5"/>
  <text x="268" y="32" font-size="16" font-weight="600" fill="#e6eef9" text-anchor="middle">Report</text>
  <circle cx="252" cy="52" r="11" fill="#00c2ff"/>
  <text x="252" y="57.5" font-size="16" font-weight="700" fill="#061630" text-anchor="middle">3</text>
  <rect x="12" y="72" width="296" height="112" rx="12" fill="none" stroke="#ffb547" stroke-width="2" stroke-dasharray="6 5"/>
  <rect x="16" y="60" width="128" height="24" rx="6" fill="#1d3d6e"/>
  <circle cx="30" cy="72" r="11" fill="#00c2ff"/>
  <text x="30" y="77.5" font-size="16" font-weight="700" fill="#061630" text-anchor="middle">1</text>
  <text x="48" y="78" font-size="16" font-weight="700" fill="#ffb547">Screenshot</text>
  <text x="24" y="110" font-size="16" font-weight="600" fill="#a3b6d2">shadow_77</text>
  <text x="296" y="110" font-size="16" font-weight="500" fill="#a3b6d2" text-anchor="end">Sat 8:40 pm</text>
  <rect x="22" y="120" width="204" height="33" rx="12" fill="#24507f" stroke="#8be3ff" stroke-width="1.5"/>
  <text x="34" y="141" font-size="16" font-weight="500" fill="#e6eef9">nobody wants you here</text>
