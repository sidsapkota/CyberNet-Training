<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 132" width="320" height="132" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif">
  <title>The same chat, labelled. A dashed frame around the username, the time and the message, marked 1, Screenshot. The Block button is marked 2, and the Report button 3.</title>
  <rect x="4" y="4" width="312" height="124" rx="16" fill="#1d3d6e" stroke="#6f8fbd" stroke-width="2"/>
  <text x="16" y="32" font-size="16" font-weight="600" fill="#e6eef9">Weekend Crew</text>
  <circle cx="138" cy="26" r="11" fill="#00c2ff"/>
  <text x="138" y="31.5" font-size="16" font-weight="700" fill="#061630" text-anchor="middle">2</text>
  <rect x="150" y="12" width="60" height="28" rx="7" fill="#061630" stroke="#6f8fbd" stroke-width="1.5"/>
  <text x="180" y="32" font-size="16" font-weight="600" fill="#e6eef9" text-anchor="middle">Block</text>
  <circle cx="230" cy="26" r="11" fill="#00c2ff"/>
  <text x="230" y="31.5" font-size="16" font-weight="700" fill="#061630" text-anchor="middle">3</text>
  <rect x="244" y="12" width="66" height="28" rx="7" fill="#061630" stroke="#6f8fbd" stroke-width="1.5"/>
  <text x="277" y="32" font-size="16" font-weight="600" fill="#e6eef9" text-anchor="middle">Report</text>
  <rect x="12" y="54" width="296" height="68" rx="12" fill="none" stroke="#ffb547" stroke-width="2" stroke-dasharray="6 5"/>
  <rect x="16" y="42" width="128" height="24" rx="6" fill="#1d3d6e"/>
  <circle cx="30" cy="54" r="11" fill="#00c2ff"/>
  <text x="30" y="59.5" font-size="16" font-weight="700" fill="#061630" text-anchor="middle">1</text>
  <text x="48" y="60" font-size="16" font-weight="700" fill="#ffb547">Screenshot</text>
  <text x="24" y="80" font-size="16" font-weight="600" fill="#a3b6d2">shadow_77</text>
  <text x="296" y="80" font-size="16" font-weight="500" fill="#a3b6d2" text-anchor="end">Sat 8:40 pm</text>
  <rect x="22" y="86" width="204" height="33" rx="12" fill="#24507f" stroke="#8be3ff" stroke-width="1.5"/>
  <text x="34" y="107" font-size="16" font-weight="500" fill="#e6eef9">nobody wants you here</text>
