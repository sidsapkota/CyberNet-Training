<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 230" width="340" height="230" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif">
  <title>A text from an unknown number, not in Sam's contacts: Hey it's Alex! New number, lost my phone. Can you send me $40 for the train home? Quick pls. Below, three choices: send the $40; reply Is it really you?; call Alex's saved number.</title>
  <rect x="4" y="4" width="332" height="122" rx="12" fill="#1d3d6e" stroke="#6f8fbd" stroke-width="2"/>
  <circle cx="30" cy="30" r="16" fill="#4a5a72" stroke="#a3b6d2" stroke-width="2"/>
  <text x="30" y="36" font-size="16" font-weight="700" fill="#e6eef9" text-anchor="middle">?</text>
  <text x="54" y="26" font-size="16" font-weight="700" fill="#e6eef9">Unknown number</text>
  <text x="54" y="46" font-size="16" font-weight="500" fill="#a3b6d2">Not in your contacts</text>
  <rect x="12" y="56" width="316" height="64" rx="12" fill="#24507f" stroke="#6f8fbd" stroke-width="1.5"/>
  <text x="22" y="76" font-size="16" font-weight="500" fill="#e6eef9">Hey it's Alex! New number, lost my</text>
  <text x="22" y="96" font-size="16" font-weight="500" fill="#e6eef9">phone. Can you send me $40 for the</text>
  <text x="22" y="114" font-size="16" font-weight="500" fill="#e6eef9">train home? Quick pls</text>
  <rect x="4" y="134" width="108" height="92" rx="10" fill="#24507f" stroke="#6f8fbd" stroke-width="1.5"/>
  <rect x="34" y="144" width="48" height="30" rx="4" fill="#3ddc97"/>
  <text x="58" y="165" font-size="16" font-weight="700" fill="#061630" text-anchor="middle">$40</text>
  <text x="58" y="210" font-size="16" font-weight="600" fill="#e6eef9" text-anchor="middle">Send the $40</text>
  <rect x="116" y="134" width="108" height="92" rx="10" fill="#24507f" stroke="#6f8fbd" stroke-width="1.5"/>
  <rect x="150" y="142" width="40" height="22" rx="8" fill="#1d3d6e" stroke="#e6eef9" stroke-width="2"/>
  <path d="M158 164l-4 7l10 -7" fill="none" stroke="#e6eef9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="170" y="194" font-size="16" font-weight="600" fill="#e6eef9" text-anchor="middle">Reply: Is it</text>
  <text x="170" y="213" font-size="16" font-weight="600" fill="#e6eef9" text-anchor="middle">really you?</text>
  <rect x="228" y="134" width="108" height="92" rx="10" fill="#24507f" stroke="#6f8fbd" stroke-width="1.5"/>
  <circle cx="270" cy="158" r="15" fill="#24507f" stroke="#8be3ff" stroke-width="2"/>
  <g transform="translate(270 158) scale(0.75)">
  <clipPath id="av-alex-270-158"><circle cx="0" cy="0" r="19"/></clipPath>
  <g clip-path="url(#av-alex-270-158)">
  <rect x="-14" y="8" width="28" height="20" rx="9" fill="#7a4f2a"/>
  <circle cx="0" cy="-2" r="9" fill="#8d5a3b"/>
  <circle cx="-6" cy="-8" r="5" fill="#2a1d16"/>
  <circle cx="0" cy="-11" r="5.5" fill="#2a1d16"/>
  <circle cx="6" cy="-8" r="5" fill="#2a1d16"/>
  </g>
  </g>
  <circle cx="298" cy="162" r="11" fill="#3ddc97"/>
  <path d="M293 158c0 5 4 9 9 9l1.5 -2.5l-3 -2l-1.5 1.5c-2 -1 -3 -2 -4 -4l1.5 -1.5l-2 -3Z" fill="#061630"/>
  <text x="282" y="194" font-size="16" font-weight="600" fill="#e6eef9" text-anchor="middle">Call Alex's</text>
  <text x="282" y="213" font-size="16" font-weight="600" fill="#e6eef9" text-anchor="middle">saved number</text>
</svg>
