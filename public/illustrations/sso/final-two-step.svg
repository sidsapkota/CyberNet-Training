<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 176" width="340" height="176" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif">
  <title>A stranger's laptop on your sign-in page. The password box is filled with dots. A second box, Code from your authenticator app, is empty. Your phone, showing a code, is with you.</title>
  <g>
  <path d="M19 54Q16 76 16 86L64 86Q64 76 61 54Z" fill="#4a5a72" stroke="#a3b6d2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M40 22C52 22 58 32 58 44L58 56L22 56L22 44C22 32 28 22 40 22Z" fill="#4a5a72" stroke="#a3b6d2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="40" cy="43" rx="10" ry="11" fill="#1d2a3d"/>
  </g>
  <rect x="76" y="8" width="180" height="128" rx="10" fill="#4a5a72" stroke="#a3b6d2" stroke-width="2"/>
  <rect x="70" y="136" width="192" height="8" rx="3" fill="#4a5a72" stroke="#a3b6d2" stroke-width="2"/>
  <rect x="86" y="18" width="160" height="110" rx="6" fill="#1d3d6e" stroke="#6f8fbd" stroke-width="1.5"/>
  <text x="96" y="40" font-size="16" font-weight="600" fill="#a3b6d2">Password</text>
  <rect x="96" y="46" width="140" height="22" rx="5" fill="#061630" stroke="#6f8fbd" stroke-width="2"/>
  <text x="104" y="63" font-size="16" font-weight="500" fill="#e6eef9" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace">••••••••</text>
  <text x="96" y="90" font-size="16" font-weight="600" fill="#a3b6d2">Code from your</text>
  <text x="96" y="108" font-size="16" font-weight="600" fill="#a3b6d2">authenticator app</text>
  <rect x="96" y="112" width="140" height="12" rx="3" fill="#061630" stroke="#6f8fbd" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M262 30q20 40 0 80" fill="none" stroke="#a3b6d2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0.1 8"/>
  <rect x="274" y="24" width="58" height="100" rx="12" fill="#24507f" stroke="#8be3ff" stroke-width="2"/>
  <path d="M295 60H311V72H295ZM298 60V56A5 5 0 0 1 308 56V60" fill="none" stroke="#e6eef9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
