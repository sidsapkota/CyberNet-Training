<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif">
  <title>The race, labelled. An arrow takes Sunshine2026 into a Guess list: password123, names, years, song lines. A bracket over violet cactus harbour pepper reads passphrase: 4 random words.</title>
  <rect x="184" y="4" width="128" height="108" rx="8" fill="#1d3d6e" stroke="#ff7a7a" stroke-width="2"/>
  <text x="196" y="26" font-size="16" font-weight="700" fill="#ff7a7a" text-anchor="start">Guess list</text>
  <text x="196" y="47" font-size="16" font-weight="400" fill="#e6eef9" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace">password123</text>
  <text x="196" y="66" font-size="16" font-weight="400" fill="#e6eef9" text-anchor="start">names</text>
  <text x="196" y="85" font-size="16" font-weight="400" fill="#e6eef9" text-anchor="start">years</text>
  <text x="196" y="104" font-size="16" font-weight="400" fill="#e6eef9" text-anchor="start">song lines</text>
  <rect x="8" y="36" width="140" height="42" rx="8" fill="#1d3d6e" stroke="#6f8fbd" stroke-width="2"/>
  <text x="18" y="63" font-size="16" font-weight="600" fill="#e6eef9" text-anchor="start" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace">Sunshine2026</text>
  <line x1="152" y1="57" x2="174" y2="57" stroke="#ff7a7a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M172 50 L182 57 L172 64 z" fill="#ff7a7a"/>
  <text x="160" y="134" font-size="16" font-weight="700" fill="#00c2ff" text-anchor="middle">passphrase: 4 random words</text>
  <path d="M20 152 V145 H300 V152 M160 145 V140" fill="none" stroke="#00c2ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="8" y="156" width="304" height="40" rx="8" fill="#1d3d6e" stroke="#00c2ff" stroke-width="2"/>
  <text x="160" y="182" font-size="16" font-weight="600" fill="#e6eef9" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace">violet cactus harbour pepper</text>
</svg>
