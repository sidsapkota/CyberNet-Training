<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 158" width="340" height="158" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif">
  <title>The green apple result. Robot A, following its recipe, says not apple (wrong). Robot B, which learned from examples, says apple (right).</title>
  <style>
    .edge { fill: #0b2142; stroke: #00c2ff; stroke-width: 2.5; stroke-linejoin: round; }
    .eye { fill: #00c2ff; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; fill: #cfe0f7; }
    .cap { font-size: 11px; font-weight: 600; fill: #a3b6d2; text-anchor: middle; }
    .tick { fill: none; stroke: #3ddc97; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .stem { fill: none; stroke: #8a6d4b; stroke-width: 2.5; stroke-linecap: round; }
    .leaf { fill: #3ddc97; }
    .photo { fill: #0b2142; stroke: #44628f; stroke-width: 2; }
    .wrongtext { fill: #ff7a7a; font-size: 11px; font-weight: 600; }
    .cross { fill: none; stroke: #ff7a7a; stroke-width: 2.5; stroke-linecap: round; }
    .righttext { fill: #041937; font-size: 12px; font-weight: 600; text-anchor: middle; }
    .yes { fill: none; stroke: #041937; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <g transform="translate(6 6)"><rect class="edge" x="0" y="0" width="150" height="30" rx="6"/><text class="mono" x="12" y="20">red + round = apple</text></g>
  <g transform="translate(246 2)">
    <rect class="photo" x="8" y="7" width="56" height="34" rx="3" transform="rotate(6 36 24)"/>
    <rect class="photo" x="2" y="4" width="56" height="34" rx="3" transform="rotate(-5 30 21)"/>
    <g transform="translate(13 9)"><rect class="photo" x="0" y="0" width="52" height="32" rx="3"/><circle cx="15" cy="16" r="7" fill="#f0674f"/><circle cx="27" cy="16" r="7" fill="#f0674f"/><path class="tick" d="M36 14 l3.5 4.5 l6 -9"/></g>
  </g>
  <g transform="translate(40 50)"><line x1="27" y1="2" x2="27" y2="-8" stroke="#00c2ff" stroke-width="2.5"/><circle cx="27" cy="-11" r="3.2" class="eye"/><rect class="edge" x="2" y="2" width="50" height="38" rx="10"/><circle cx="18" cy="20" r="4" class="eye"/><circle cx="36" cy="20" r="4" class="eye"/><rect class="edge" x="8" y="44" width="38" height="28" rx="7"/></g>
  <g transform="translate(248 50)"><line x1="27" y1="2" x2="27" y2="-8" stroke="#00c2ff" stroke-width="2.5"/><circle cx="27" cy="-11" r="3.2" class="eye"/><rect class="edge" x="2" y="2" width="50" height="38" rx="10"/><circle cx="18" cy="20" r="4" class="eye"/><circle cx="36" cy="20" r="4" class="eye"/><rect class="edge" x="8" y="44" width="38" height="28" rx="7"/></g>
  <g transform="translate(170 92)">
    <path class="stem" d="M0 -13 q4 -5 1 -10"/>
    <path class="leaf" d="M1 -18 q11 -4 10 5 q-10 2 -10 -5 z"/>
    <path fill="#5cc98c" d="M0 -11 q-16 -4 -16 13 q0 16 16 18 q16 -2 16 -18 q0 -16 -16 -13 z"/>
    <ellipse cx="-5" cy="4" rx="3.5" ry="6" fill="#9ee8bf" opacity="0.6"/>
  </g>
  <!-- Robot A: wrong (not apple) -->
  <g transform="translate(66 92)">
    <rect x="-42" y="0" width="84" height="22" rx="11" fill="#2a1622" stroke="#ff7a7a" stroke-width="2"/>
    <text class="wrongtext" x="-32" y="15">not apple</text>
    <path class="cross" d="M24 7 l9 9 M33 7 l-9 9"/>
  </g>
  <!-- Robot B: right (apple) -->
  <g transform="translate(274 92)">
    <rect x="-33" y="0" width="66" height="22" rx="11" fill="#00c2ff"/>
    <text class="righttext" x="-6" y="15">apple</text>
    <path class="yes" d="M14 11 l4 5 l7 -9"/>
  </g>
  <text class="cap" x="67" y="150">Robot A</text>
  <text class="cap" x="274" y="150">Robot B</text>
</svg>
